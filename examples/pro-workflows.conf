# Additional workflow defaults: safe to merge into a shared Community/Pro config.
# Cinematic motion is opt-in; speech and notes never start from opening the panel.

[zoom]
motion = legacy
follow_region_percent = 35
follow_hysteresis_percent = 5
pan_settle_ms = 400
focus_margin_percent = 12
avoid_camera = true
auto = off
auto_factor = 2
auto_hold_ms = 1600
auto_cooldown_ms = 700
auto_idle_ms = 2500
auto_cluster_radius_percent = 12
manual_override_ms = 5000
filter = bilinear
motion_blur = false
shutter_angle = 120
blur_samples = 4

[cursor]
smooth = false
settle_ms = 60
max_lag_ms = 80
hide_idle_ms = 0

[transcription]
enabled = false
backend = whisper
model_path =
device = cpu
language = auto
task = transcribe
source = mic
threads = 4
vad_backend = energy
vad_model_path =
vad_threshold = 0.5
min_speech_ms = 250
min_silence_ms = 500
window_ms = 6000
step_ms = 500
max_backlog_ms = 12000
show_partial = true
auto_finalize = true

[subtitles]
virtual = false
record = false
stream = false
sidecar = none
font = Noto Sans
size = 36
color = #ffffff
opacity = 1
outline_width = 2
outline_color = #000000
background = true
background_color = #101113
background_opacity = 0.75
background_radius = 8
padding_x = 16
padding_y = 10
anchor = bottom
align = center
margin_x = 48
margin_y = 48
max_width_percent = 85
max_lines = 2
line_spacing = 1.15
hold_ms = 2000

[notes]
file =
format = auto
font = Noto Sans
font_size = 36
foreground = #f8f9fb
background = #101113
highlight_color = #80c9ff
read_opacity = 0.7
line_spacing = 1.45
padding = 32
column_chars = 42
align = left
window_width = 760
window_height = 560
always_on_top = false
reading_line_percent = 35
mode = timed
speed_lines_per_minute = 12
scroll_smooth_ms = 250
speech_max_lines_per_second = 6
follow_threshold = 0.75
reacquire_threshold = 0.85
ambiguity_margin = 0.12
reacquire_min_words = 5
follow_window_words = 120
off_script_grace_ms = 1200
silence_hold_ms = 800
allow_backward_reacquire = false
match_code_blocks = false
exclude_from_capture = true

