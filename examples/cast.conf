
[output]
backend = xorg
device = /dev/video10
width = 1920
height = 1080
fps = 30
enabled = true
pause_background = #20252b
pause_title = Paused
pause_subtitle =
pause_footer =
pause_font = Noto Sans
pause_foreground = #ffffff
pause_title_size = 48
pause_subtitle_size = 24
pause_footer_size = 18
pause_text_gap = 12
blur_title = Blurred
blur_subtitle =
blur_footer =
blur_font = Noto Sans
blur_color = #101113
blur_foreground = #ffffff
blur_radius = 32
blur_opacity = 0.60
blur_title_size = 48
blur_subtitle_size = 24
blur_footer_size = 18
blur_text_gap = 12

[camera]
device = /dev/video0
enabled = true
visible = true
shape = rounded
anchor = bottom-right
aspect = native
width_percent = 22
margin = 24
radius = 24
border_width = 2
border_color = #ffffff
background = blurred
background_color = #20252b
background_blur_radius = 96
background_brightness = 0.25

[screen]
width_percent = 78
margin = 32
radius = 0
border_width = 0
border_color = #ffffff
background = blurred
background_color = #20252b
background_blur_radius = 96
background_brightness = 0.25

[background]
source = screen
gradient_from = #101827
gradient_via = #26354a
gradient_to = #080b12
gradient_via_enabled = true
gradient_angle = 135
gradient_waypoint = 50

[logo]
enabled = false
path =
anchor = bottom-right
width_percent = 12
margin_x = 24
margin_y = 24
opacity = 1

[text]
enabled = false
content =
font = Noto Sans
size = 28
color = #ffffff
anchor = bottom-left
margin_x = 24
margin_y = 24
opacity = 1

[camera]
x = 0
y = 0
crop_x = 0
crop_y = 0
mirror = true
corner_order = bottom-right,bottom-left,top-left,top-right

[composition]
layout = overlay
layout_order = overlay,stage,split,screen,camera
split_side = left
split_ratio = 25
fit = contain
preset_order = coding,demo,conversation

[capture]
monitor =
kind = monitor
exclusion = mask
mask_color = #20252b
x = 0
y = 0
width = 0
height = 0

[zoom]
factor = 2
min = 1
max = 8
step = 0.25
transition_ms = 250
follow = true
deadzone = 80
smoothing = 0.18

[cursor]
enabled = true
highlight = false
size = 24
color = #ffcc33

[clicks]
enabled = false
duration_ms = 600
radius = 40
left_color = #ffcc33
right_color = #3399ff
middle_color = #cc66ff
middle = false

[keys]
enabled = false
mode = shortcuts
position = bottom-left
font_size = 24
timeout_ms = 3000
color = #ffffff
background = #20252b
filter = Super+Pause,Super+F9,Super+F10,Super+F11,Super+F12,Super+Shift+P,Super+Shift+R,Super+P,Super+Shift+Space,Super+Shift+C,Super+=,Super+-,Super+Shift+A,Super+Shift+L,Super+Shift+D,Super+Shift+M,Super+Shift+S,Super+Z,Super+Shift++,Super+Shift+_,Super+Shift+K,Super+Shift+B,Super+Shift+V,Ctrl+Super+Shift+R,Ctrl+Super+Shift+S,Ctrl+Super+F,Ctrl+Super+Shift+F
navigation = Left,Right,Up,Down,Home,End,Page_Up,Page_Down,Escape,Tab,Return,BackSpace,Delete

[annotations]
virtual_keys = true
virtual_clicks = true
record_keys = true
record_clicks = true

[audio]
mic = false
desktop = false
mic_source =
desktop_source =
mic_gain = 1
desktop_gain = 1
virtual = false
virtual_name = cast-microphone

[record]
directory = .
container = matroska
video_codec = libx264
audio_codec = aac
crf = 23
preset = veryfast
countdown = 0
queue = 8

[stream]
service = custom
server_url =
key_file =
tls_ca_file =
video_bitrate_kbps = 2500
audio_bitrate_kbps = 128
encoder_preset = veryfast
queue_frames = 3
lag_ms = 250
connect_timeout_ms = 5000
write_timeout_ms = 3000
reconnect_attempts = 3
reconnect_initial_ms = 500
reconnect_max_ms = 4000

[annotations]
stream_keys = true
stream_clicks = true

[preview]
enabled = false
target = virtual

[ipc]
socket =
timeout_ms = 5000

[preset.coding]
layout = screen

[preset.demo]
layout = overlay
camera_shape = circle
camera_width_percent = 18

[preset.conversation]
layout = camera
