name: Static Linux release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag; leave empty to test the selected ref without publishing'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: static-linux-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve exact source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      publish: ${{ steps.source.outputs.publish }}
      release_id: ${{ steps.source.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release tag or dry run commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag=$INPUT_TAG
          if [[ "$EVENT_NAME" == release ]]; then
            tag=$EVENT_TAG
          fi
          publish=false
          release_id=
          commit=$(git rev-parse HEAD)
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]
            git check-ref-format "refs/tags/$tag"
            # The old release predates the Arch recipe and remains immutable.
            [[ "$tag" != v0.1 ]]
            release=$(gh api "repos/$GH_REPO/releases/tags/$tag")
            [[ $(jq -r '.draft' <<< "$release") == false ]]
            [[ $(jq -r '.tag_name' <<< "$release") == "$tag" ]]
            release_id=$(jq -r '.id' <<< "$release")
            [[ "$release_id" =~ ^[0-9]+$ ]]
            if [[ "$EVENT_NAME" == release ]]; then
              [[ "$release_id" == "$EVENT_RELEASE_ID" ]]
            fi
            object=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '[.object.type, .object.sha] | @tsv')
            read -r kind commit <<< "$object"
            for depth in {1..16}; do
              [[ "$kind" == tag ]] || break
              object=$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '[.object.type, .object.sha] | @tsv')
              read -r kind commit <<< "$object"
            done
            [[ "$kind" == commit && "$commit" =~ ^[0-9a-f]{40}$ ]]
            version=$(gh api "repos/$GH_REPO/contents/src/cast.h?ref=$commit" --jq .content | \
              base64 --decode | sed -n 's/^#define CAST_VERSION "\([^"]*\)"/\1/p')
            publish=true
          else
            version=$(sed -n 's/^#define CAST_VERSION "\([^"]*\)"/\1/p' src/cast.h)
            [[ "$version" =~ ^[0-9][0-9A-Za-z.-]*$ ]]
            tag=v$version
          fi
          [[ "$version" =~ ^[0-9][0-9A-Za-z.-]*$ ]]
          printf 'commit=%s\ntag=%s\nversion=%s\npublish=%s\nrelease_id=%s\n' \
            "$commit" "$tag" "$version" "$publish" "$release_id" >> "$GITHUB_OUTPUT"
          printf 'Source: %s at %s; publish=%s\n' "$tag" "$commit" "$publish"

  build:
    name: Build and verify static Linux x86_64
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Install build SDK and desktop test services
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson nasm pkg-config python3 \
            libfontconfig1-dev libfreetype-dev libpipewire-0.3-dev libglib2.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev libxcomposite-dev \
            libxrender-dev libxcb1-dev libxau-dev libxdmcp-dev libxtst-dev libxcursor-dev libxss-dev libxinerama-dev libxt-dev libxv-dev libudev-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libssl-dev zlib1g-dev libbz2-dev liblzma-dev libpng-dev libbrotli-dev \
            libpcre2-dev libffi-dev libmount-dev libselinux1-dev libsepol-dev libblkid-dev \
            libdbus-1-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            xvfb xauth x11-utils x11-xserver-utils xdotool xclip dbus-x11 \
            pipewire pipewire-pulse wireplumber pulseaudio-utils ffmpeg fonts-dejavu-core curl git zsh fish
      - name: Build actual static executable and run unit and CLI tests
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 packaging/public-boundary.py
          python3 packaging/build-static-linux.py --jobs 4
      - name: Verify PipeWire capture with a synthetic null sink
        run: dbus-run-session -- python3 packaging/test-static-audio.py
      - name: Preserve exact linked dependency sources
        run: python3 packaging/static-linux-sources.py
      - name: Prepare verified static release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/static-linux
          prefix="cast-$RELEASE_VERSION-linux-x86_64-static"
          cp build/static-linux/cast "dist/static-linux/$prefix"
          cp build/static-linux/build-info.json "dist/static-linux/$prefix-build-info.json"
          printf '%s\n' "$SOURCE_COMMIT" > "dist/static-linux/$prefix-source-commit.txt"
          tar -czf "dist/static-linux/$prefix-corresponding-sources.tar.gz" -C build/static-linux corresponding-sources
          readelf -l "dist/static-linux/$prefix" > "dist/static-linux/$prefix-elf.txt"
          readelf -d "dist/static-linux/$prefix" >> "dist/static-linux/$prefix-elf.txt"
          ! grep -E 'INTERP|NEEDED' "dist/static-linux/$prefix-elf.txt"
          cd dist/static-linux
          sha256sum "$prefix" "$prefix-build-info.json" "$prefix-source-commit.txt" \
            "$prefix-corresponding-sources.tar.gz" "$prefix-elf.txt" > "$prefix-SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cast-static-linux-x86_64
          path: dist/static-linux/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach verified static Linux executable
    needs: [source, build]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_ID: ${{ needs.source.outputs.release_id }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cast-static-linux-x86_64
          path: static-linux-assets
      - name: Verify release identity and upload new assets
        shell: bash
        run: |
          set -euo pipefail
          cd static-linux-assets
          prefix="cast-$RELEASE_VERSION-linux-x86_64-static"
          [[ $(cat "$prefix-source-commit.txt") == "$SOURCE_COMMIT" ]]
          sha256sum -c "$prefix-SHA256SUMS"
          assets=( "$prefix" "$prefix-source-commit.txt" "$prefix-build-info.json" "$prefix-SHA256SUMS"
                   "$prefix-corresponding-sources.tar.gz" "$prefix-elf.txt" )
          [[ $(find . -maxdepth 1 -type f | wc -l) == ${#assets[@]} ]]
          release=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")
          [[ $(jq -r '.id' <<< "$release") == "$RELEASE_ID" ]]
          [[ $(jq -r '.draft' <<< "$release") == false ]]
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv')
          read -r kind commit <<< "$object"
          for depth in {1..16}; do
            [[ "$kind" == tag ]] || break
            object=$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '[.object.type, .object.sha] | @tsv')
            read -r kind commit <<< "$object"
          done
          [[ "$kind" == commit && "$commit" == "$SOURCE_COMMIT" ]]
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" ]]
            jq -e --arg name "$asset" 'all(.assets[]; .name != $name)' <<< "$release" >/dev/null
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO"
