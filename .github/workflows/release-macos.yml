name: macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag; leave empty to test the selected ref without publishing'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve exact source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      publish: ${{ steps.source.outputs.publish }}
      release_id: ${{ steps.source.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release tag or dry run commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag=$INPUT_TAG
          if [[ "$EVENT_NAME" == release ]]; then
            tag=$EVENT_TAG
          fi
          publish=false
          release_id=
          commit=$(git rev-parse HEAD)
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]
            git check-ref-format "refs/tags/$tag"
            # The old release predates the Arch recipe and remains immutable.
            [[ "$tag" != v0.1 ]]
            release=$(gh api "repos/$GH_REPO/releases/tags/$tag")
            [[ $(jq -r '.draft' <<< "$release") == false ]]
            [[ $(jq -r '.tag_name' <<< "$release") == "$tag" ]]
            release_id=$(jq -r '.id' <<< "$release")
            [[ "$release_id" =~ ^[0-9]+$ ]]
            if [[ "$EVENT_NAME" == release ]]; then
              [[ "$release_id" == "$EVENT_RELEASE_ID" ]]
            fi
            object=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '[.object.type, .object.sha] | @tsv')
            read -r kind commit <<< "$object"
            for depth in {1..16}; do
              [[ "$kind" == tag ]] || break
              object=$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '[.object.type, .object.sha] | @tsv')
              read -r kind commit <<< "$object"
            done
            [[ "$kind" == commit && "$commit" =~ ^[0-9a-f]{40}$ ]]
            version=$(gh api "repos/$GH_REPO/contents/src/cast.h?ref=$commit" --jq .content | \
              base64 --decode | sed -n 's/^#define CAST_VERSION "\([^"]*\)"/\1/p')
            publish=true
          else
            version=$(sed -n 's/^#define CAST_VERSION "\([^"]*\)"/\1/p' src/cast.h)
            [[ "$version" =~ ^[0-9][0-9A-Za-z.-]*$ ]]
            tag=v$version
          fi
          [[ "$version" =~ ^[0-9][0-9A-Za-z.-]*$ ]]
          printf 'commit=%s\ntag=%s\nversion=%s\npublish=%s\nrelease_id=%s\n' \
            "$commit" "$tag" "$version" "$publish" "$release_id" >> "$GITHUB_OUTPUT"
          printf 'Source: %s at %s; publish=%s\n' "$tag" "$commit" "$publish"

  build:
    name: Build standalone macOS arm64 app
    needs: source
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Install build dependencies
        run: brew install pkgconf fontconfig freetype sdl3 sdl3_ttf nasm ffmpeg
      - name: Build and check exact release source
        shell: bash
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$SOURCE_COMMIT" ]]
          [[ $(uname -m) == arm64 ]]
          python3 packaging/public-boundary.py
          python3 tools/deps-lgpl.py --root build/deps-lgpl-macos --jobs 4
          make -j4 EDITION=community MEDIA_PROFILE=lgpl LGPL_ROOT="$PWD/build/deps-lgpl-macos"
          # Test executables in older tags omit the controlled-media runtime path.
          DYLD_LIBRARY_PATH="$PWD/build/deps-lgpl-macos/prefix/lib" make EDITION=community MEDIA_PROFILE=lgpl LGPL_ROOT="$PWD/build/deps-lgpl-macos" check-macos
          make EDITION=community MEDIA_PROFILE=lgpl LGPL_ROOT="$PWD/build/deps-lgpl-macos" MACOS_STANDALONE=1 macos-app
      - name: Verify and archive standalone app
        shell: bash
        run: |
          set -euo pipefail
          app='build/macos/Super Screencast.app'
          [[ $("$app/Contents/MacOS/cast" --version) == "cast $RELEASE_VERSION" ]]
          python3 tests/test_macos_bundle.py --app "$app"
          python3 tests/test_macos_smoke.py --binary "$app/Contents/MacOS/cast"
          # Inspect every bundled Mach-O, including libraries copied by the packager.
          while IFS= read -r -d '' file; do
            file "$file" | grep -q 'Mach-O' || continue
            if otool -L "$file" | tail -n +2 | grep -E '/(opt/homebrew|usr/local|Users)/'; then
              echo "Nonportable dependency in $file" >&2
              exit 1
            fi
          done < <(find "$app" -type f -print0)
          mkdir -p dist/macos
          prefix="cast-$RELEASE_VERSION-macos-arm64"
          python3 packaging/macos-sources.py --app "$app" --output "dist/macos/$prefix-homebrew-sources.tar.gz"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/macos/$prefix.zip"
          cp build/deps-lgpl-macos/corresponding-sources.tar.gz "dist/macos/$prefix-media-sources.tar.gz"
          tar -czf "dist/macos/$prefix-media-build-materials.tar.gz" -C build/deps-lgpl-macos build-materials profile.json
          git archive --format=tar.gz --prefix="cast-$RELEASE_VERSION/" HEAD > "dist/macos/$prefix-source.tar.gz"
          printf '%s\n' "$SOURCE_COMMIT" > "dist/macos/$prefix-source-commit.txt"
          {
            sw_vers
            clang --version
            brew list --versions
            printf '\nSigning: ad hoc; not notarized\n'
          } > "dist/macos/$prefix-build-info.txt"
          cd dist/macos
          shasum -a 256 "$prefix.zip" "$prefix-source-commit.txt" "$prefix-build-info.txt" "$prefix-media-sources.tar.gz" "$prefix-media-build-materials.tar.gz" "$prefix-homebrew-sources.tar.gz" "$prefix-source.tar.gz" > "$prefix-SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cast-macos-arm64
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach tested macOS app
    needs: [source, build]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_ID: ${{ needs.source.outputs.release_id }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cast-macos-arm64
          path: macos-assets
      - name: Verify release identity and upload new assets
        shell: bash
        run: |
          set -euo pipefail
          cd macos-assets
          prefix="cast-$RELEASE_VERSION-macos-arm64"
          [[ $(cat "$prefix-source-commit.txt") == "$SOURCE_COMMIT" ]]
          sha256sum -c "$prefix-SHA256SUMS"
          assets=( "$prefix.zip" "$prefix-source-commit.txt" "$prefix-build-info.txt" "$prefix-SHA256SUMS" "$prefix-media-sources.tar.gz" "$prefix-media-build-materials.tar.gz" "$prefix-homebrew-sources.tar.gz" "$prefix-source.tar.gz" )
          [[ $(find . -maxdepth 1 -type f | wc -l) == ${#assets[@]} ]]
          release=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")
          [[ $(jq -r '.id' <<< "$release") == "$RELEASE_ID" ]]
          [[ $(jq -r '.draft' <<< "$release") == false ]]
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv')
          read -r kind commit <<< "$object"
          for depth in {1..16}; do
            [[ "$kind" == tag ]] || break
            object=$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '[.object.type, .object.sha] | @tsv')
            read -r kind commit <<< "$object"
          done
          [[ "$kind" == commit && "$commit" == "$SOURCE_COMMIT" ]]
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" ]]
            jq -e --arg name "$asset" 'all(.assets[]; .name != $name)' <<< "$release" >/dev/null
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO"
